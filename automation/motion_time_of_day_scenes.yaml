blueprint:
  name: Motion Time-of-Day Scenes with Override
  description: |
    Bewegungsgesteuertes Licht mit Tageszeit-Szenen.

    Features:
    - 4 Tageszeit-Szenen (Morgen, Tag, Abend, Nacht)
    - Adaptive Lighting Support pro Szene
    - Eigene Ausschaltzeit pro Tageszeit
    - Toggle-Schalter (Wandschalter/Shelly)
    - Erkennt manuelle Steuerung (HA-App, etc.) - optional
    - Helligkeitsprüfung (optional): Lux-Sensor/PV-Leistung mit Schwelle und/oder Tageslicht-Binärsensor
    - Hell-Szene (optional): reduziertes Licht statt gar keinem, wenn es hell ist
    - Wetter-Weiche (optional): bei trübem Wetter eine eigene Szene für Morgen, Tag und Abend
    - Abwechslung (optional): weitere Szenen je Tageszeit, eine pro Tag
    - Blocker zum Deaktivieren
    - Licht-Aktionen laufen mit continue_on_error weiter, wenn ein einzelnes Gerät nicht antwortet
    - Tageszeitwechsel setzt die neue Szene nur, wenn das Licht bereits an ist (schaltet nie von selbst ein)
    - Aus-Befehl wird nach 10 Sekunden einmal wiederholt (Zigbee-Lampen, die den ersten Befehl verschlucken)
    - Wächter (optional): schaltet aus, wenn der Melder ungewöhnlich lange durchgehend "anwesend" meldet

    Erstelle 2 Timer Helper: Einstellungen → Helfer → Timer
    - Cooldown Timer (Sperrzeiten)
    - Ausschalt-Timer (automatisches Ausschalten)
  domain: automation
  source_url: https://github.com/hoizi89/ha-blueprints/blob/master/automation/motion_time_of_day_scenes.yaml
  author: hoizi89

  input:
    motion_sensor:
      name: "1. Bewegungsmelder"
      description: Welcher Sensor erkennt Bewegung?
      selector:
        entity:
          filter:
            domain: binary_sensor
            device_class:
              - motion
              - occupancy

    target_lights:
      name: "2. Lichter"
      description: Welche Lichter sollen gesteuert werden?
      selector:
        target:
          entity:
            domain: light

    override_switch:
      name: "3. Wandschalter"
      description: Welcher Schalter für manuelle Steuerung? (Toggle)
      selector:
        entity:
          filter:
            domain:
              - switch
              - input_boolean
              - light
              - binary_sensor

    cooldown_timer:
      name: "4. Cooldown Timer"
      description: "Timer für Sperrzeiten. Erstelle unter: Einstellungen → Helfer → Timer"
      selector:
        entity:
          filter:
            domain: timer

    off_timer:
      name: "5. Ausschalt-Timer"
      description: "Timer für automatisches Ausschalten. Erstelle unter: Einstellungen → Helfer → Timer"
      selector:
        entity:
          filter:
            domain: timer

    monitor_light:
      name: "6. Licht-Überwachung (optional)"
      description: "Ein Licht zum Erkennen manueller Änderungen UND als Referenz ob das Licht wirklich an ist. Bei WLED: das Main-Segment verwenden (nicht Ambiente/Porsche Segment-Toggles)."
      default: []
      selector:
        entity:
          filter:
            domain: light

    override_scene:
      name: "Schalter-Szene (hell)"
      description: Szene wenn Schalter gedrückt wird.
      selector:
        entity:
          filter:
            domain: scene

    override_adaptive_lights:
      name: "Schalter - Adaptive Lights"
      description: "Optional. Diese Lichter werden nach der Szene nochmal ohne Werte eingeschaltet → Adaptive Lighting übernimmt."
      default: []
      selector:
        target:
          entity:
            domain: light

    morning_scene:
      name: "Morgen-Szene"
      description: "Optional. Leer = Licht bleibt aus."
      default: []
      selector:
        entity:
          filter:
            domain: scene

    morning_adaptive_lights:
      name: "Morgen - Adaptive Lights"
      description: "Optional. Diese Lichter werden nach der Szene nochmal ohne Werte eingeschaltet → Adaptive Lighting übernimmt."
      default: []
      selector:
        target:
          entity:
            domain: light

    day_scene:
      name: "Tag-Szene"
      description: "Optional. Leer = Licht bleibt aus."
      default: []
      selector:
        entity:
          filter:
            domain: scene

    day_adaptive_lights:
      name: "Tag - Adaptive Lights"
      description: "Optional. Diese Lichter werden nach der Szene nochmal ohne Werte eingeschaltet → Adaptive Lighting übernimmt."
      default: []
      selector:
        target:
          entity:
            domain: light

    evening_scene:
      name: "Abend-Szene"
      description: "Optional. Leer = Licht bleibt aus."
      default: []
      selector:
        entity:
          filter:
            domain: scene

    evening_adaptive_lights:
      name: "Abend - Adaptive Lights"
      description: "Optional. Diese Lichter werden nach der Szene nochmal ohne Werte eingeschaltet → Adaptive Lighting übernimmt."
      default: []
      selector:
        target:
          entity:
            domain: light

    night_scene:
      name: "Nacht-Szene"
      description: "Optional. Leer = Licht bleibt aus."
      default: []
      selector:
        entity:
          filter:
            domain: scene

    night_adaptive_lights:
      name: "Nacht - Adaptive Lights"
      description: "Optional. Diese Lichter werden nach der Szene nochmal ohne Werte eingeschaltet → Adaptive Lighting übernimmt."
      default: []
      selector:
        target:
          entity:
            domain: light

    morning_start:
      name: "Morgen ab"
      default: "06:00:00"
      selector:
        time: {}

    day_start:
      name: "Tag ab"
      default: "09:00:00"
      selector:
        time: {}

    evening_start:
      name: "Abend ab"
      default: "18:00:00"
      selector:
        time: {}

    night_start:
      name: "Nacht ab"
      default: "22:00:00"
      selector:
        time: {}

    morning_off_delay:
      name: "Morgen Ausschaltzeit"
      description: "Wie lange bleibt das Licht an nach Bewegung?"
      default:
        minutes: 10
      selector:
        duration:
          enable_day: false

    day_off_delay:
      name: "Tag Ausschaltzeit"
      description: "Wie lange bleibt das Licht an nach Bewegung?"
      default:
        minutes: 30
      selector:
        duration:
          enable_day: false

    evening_off_delay:
      name: "Abend Ausschaltzeit"
      description: "Wie lange bleibt das Licht an nach Bewegung?"
      default:
        minutes: 15
      selector:
        duration:
          enable_day: false

    night_off_delay:
      name: "Nacht Ausschaltzeit"
      description: "Wie lange bleibt das Licht an nach Bewegung?"
      default:
        minutes: 5
      selector:
        duration:
          enable_day: false

    switch_cooldown:
      name: "Sperre nach Schalter"
      description: Kurz, verhindert sofortiges Re-Triggern.
      default:
        seconds: 45
      selector:
        duration:
          enable_day: false

    manual_cooldown:
      name: "Sperre nach App"
      description: Lang, du behältst Kontrolle.
      default:
        minutes: 15
      selector:
        duration:
          enable_day: false

    transition_time:
      name: "Übergang"
      description: Sanftes Ein-/Ausschalten.
      default: 1
      selector:
        number:
          min: 0
          max: 5
          step: 0.5
          unit_of_measurement: s

    illuminance_sensor:
      name: "Helligkeitssensor (Lux oder PV-Leistung)"
      description: "Optional. Numerischer Sensor, z. B. Lux-Sensor oder aktuelle PV-Leistung in W. Unter der Schwelle gilt es als dunkel."
      default: []
      selector:
        entity:
          filter:
            domain: sensor

    illuminance_threshold:
      name: "Dunkel unter (Sensorwert)"
      description: "Schwelle für den Helligkeitssensor: Lux bei einem Lux-Sensor, Watt bei PV-Leistung."
      default: 50
      selector:
        number:
          min: 0
          max: 20000
          step: 10
          mode: box

    daylight_sensor:
      name: "Tageslicht-Sensor (an = hell)"
      description: "Optional. Binärsensor, der sagt ob es hell ist, z. B. PV-Überschuss-Stufe. Solange er AN ist, gilt es als hell."
      default: []
      selector:
        entity:
          filter:
            domain:
              - binary_sensor
              - input_boolean

    bright_scene:
      name: "Hell-Szene (reduziertes Licht)"
      description: "Optional. Wenn es laut Helligkeitssensor/Tageslicht-Sensor hell ist, wird bei Bewegung diese Szene statt der Tageszeit-Szene aktiviert. Leer = bei Helligkeit bleibt das Licht aus. Nachts wird sie nie verwendet."
      default: []
      selector:
        entity:
          filter:
            domain: scene

    weather_entity:
      name: "Wetter-Weiche: Wetter-Entität"
      description: "Optional. Ist ihr Zustand einer der trüben Zustände unten, wird statt der Tageszeit-Szene die Trüb-Szene dieser Tageszeit verwendet (falls gesetzt). Leer = keine Wetter-Weiche."
      default: []
      selector:
        entity:
          filter:
            domain: weather

    dull_weather_states:
      name: "Wetter-Weiche: trübe Zustände"
      description: "Bei diesen Wetter-Zuständen gilt es als trüb."
      default:
        - cloudy
        - fog
        - rainy
        - pouring
        - snowy
        - snowy-rainy
        - hail
        - lightning
        - lightning-rainy
      selector:
        select:
          multiple: true
          options:
            - { label: "Bewölkt", value: cloudy }
            - { label: "Teilweise bewölkt", value: partlycloudy }
            - { label: "Nebel", value: fog }
            - { label: "Regen", value: rainy }
            - { label: "Starkregen", value: pouring }
            - { label: "Schnee", value: snowy }
            - { label: "Schneeregen", value: snowy-rainy }
            - { label: "Hagel", value: hail }
            - { label: "Gewitter", value: lightning }
            - { label: "Gewitter mit Regen", value: lightning-rainy }
            - { label: "Wind", value: windy }
            - { label: "Wind und Wolken", value: windy-variant }
            - { label: "Außergewöhnlich", value: exceptional }

    morning_scene_dull:
      name: "Wetter-Weiche: Morgen-Szene bei trübem Wetter"
      description: "Optional. Leer = auch bei trübem Wetter die normale Morgen-Szene."
      default: []
      selector:
        entity:
          filter:
            domain: scene

    day_scene_dull:
      name: "Wetter-Weiche: Tag-Szene bei trübem Wetter"
      description: "Optional. Leer = auch bei trübem Wetter die normale Tag-Szene."
      default: []
      selector:
        entity:
          filter:
            domain: scene

    evening_scene_dull:
      name: "Wetter-Weiche: Abend-Szene bei trübem Wetter"
      description: "Optional. Leer = auch bei trübem Wetter die normale Abend-Szene."
      default: []
      selector:
        entity:
          filter:
            domain: scene

    morning_scene_rotation:
      name: "Abwechslung: weitere Morgen-Szenen"
      description: "Optional. Diese Szenen wechseln sich mit der Morgen-Szene ab, eine pro Tag (nicht bei jeder Bewegung). Bei trübem Wetter gilt die Trüb-Szene."
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: scene

    day_scene_rotation:
      name: "Abwechslung: weitere Tag-Szenen"
      description: "Optional. Wechseln sich mit der Tag-Szene ab, eine pro Tag."
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: scene

    evening_scene_rotation:
      name: "Abwechslung: weitere Abend-Szenen"
      description: "Optional. Wechseln sich mit der Abend-Szene ab, eine pro Tag."
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: scene

    night_scene_rotation:
      name: "Abwechslung: weitere Nacht-Szenen"
      description: "Optional. Wechseln sich mit der Nacht-Szene ab, eine pro Nacht."
      default: []
      selector:
        entity:
          multiple: true
          filter:
            domain: scene

    presence_max_duration:
      name: "Wächter: maximale Dauer-Anwesenheit"
      description: "Optional. Meldet der Melder länger als diese Zeit ununterbrochen Anwesenheit, wird das Licht ausgeschaltet (hängender Präsenzmelder). 0 = Wächter aus."
      default:
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration:
          enable_day: false

    blocker_entity:
      name: "Blocker"
      description: "Optional. Wenn ON = Automatik komplett aus."
      default: []
      selector:
        entity:
          filter:
            domain:
              - input_boolean
              - switch
              - binary_sensor

mode: parallel
max: 3
max_exceeded: silent

variables:
  motion_sensor: !input motion_sensor
  cooldown_timer: !input cooldown_timer
  off_timer: !input off_timer
  monitor_light: !input monitor_light
  illuminance_sensor: !input illuminance_sensor
  illuminance_threshold: !input illuminance_threshold
  daylight_sensor: !input daylight_sensor
  bright_scene: !input bright_scene
  presence_max_duration: !input presence_max_duration
  watchdog_seconds: >
    {{ (presence_max_duration.hours | default(0) | int(0)) * 3600
       + (presence_max_duration.minutes | default(0) | int(0)) * 60
       + (presence_max_duration.seconds | default(0) | int(0)) }}
  blocker_entity: !input blocker_entity
  morning_scene: !input morning_scene
  day_scene: !input day_scene
  evening_scene: !input evening_scene
  night_scene: !input night_scene
  override_scene: !input override_scene

  override_adaptive_lights: !input override_adaptive_lights
  morning_adaptive_lights: !input morning_adaptive_lights
  day_adaptive_lights: !input day_adaptive_lights
  evening_adaptive_lights: !input evening_adaptive_lights
  night_adaptive_lights: !input night_adaptive_lights
  transition_time: !input transition_time
  switch_cooldown: !input switch_cooldown
  manual_cooldown: !input manual_cooldown
  morning_start: !input morning_start
  day_start: !input day_start
  evening_start: !input evening_start
  night_start: !input night_start

  morning_off_delay: !input morning_off_delay
  day_off_delay: !input day_off_delay
  evening_off_delay: !input evening_off_delay
  night_off_delay: !input night_off_delay

  now_minutes: "{{ now().hour * 60 + now().minute }}"
  morning_minutes: "{{ (morning_start.split(':')[0] | int) * 60 + (morning_start.split(':')[1] | int) }}"
  day_minutes: "{{ (day_start.split(':')[0] | int) * 60 + (day_start.split(':')[1] | int) }}"
  evening_minutes: "{{ (evening_start.split(':')[0] | int) * 60 + (evening_start.split(':')[1] | int) }}"
  night_minutes: "{{ (night_start.split(':')[0] | int) * 60 + (night_start.split(':')[1] | int) }}"

  is_morning: "{{ morning_minutes <= now_minutes < day_minutes }}"
  is_day: "{{ day_minutes <= now_minutes < evening_minutes }}"
  is_evening: "{{ evening_minutes <= now_minutes < night_minutes }}"
  is_night: "{{ now_minutes >= night_minutes or now_minutes < morning_minutes }}"

  current_off_delay: >
    {% if is_morning %}
      {{ morning_off_delay }}
    {% elif is_day %}
      {{ day_off_delay }}
    {% elif is_evening %}
      {{ evening_off_delay }}
    {% else %}
      {{ night_off_delay }}
    {% endif %}

  # ----- Helligkeit -----
  has_illuminance: "{{ illuminance_sensor | length > 0 }}"
  has_daylight_sensor: "{{ daylight_sensor | length > 0 }}"
  # dunkel = Sensorwert unter Schwelle (falls gesetzt) UND Tageslicht-Sensor nicht AN (falls gesetzt)
  is_dark: >
    {{ (not has_illuminance or (states(illuminance_sensor) | float(0)) < illuminance_threshold)
       and (not has_daylight_sensor or states(daylight_sensor) != 'on') }}
  has_bright_scene: "{{ bright_scene | length > 0 }}"
  # Hell-Szene statt Tageszeit-Szene: nur wenn gesetzt, es hell ist und nicht Nacht
  use_bright_scene: "{{ has_bright_scene and not is_dark and not is_night }}"

  has_morning_scene: "{{ morning_scene | length > 0 }}"
  has_day_scene: "{{ day_scene | length > 0 }}"
  has_evening_scene: "{{ evening_scene | length > 0 }}"
  has_night_scene: "{{ night_scene | length > 0 }}"

  # ----- Wetter-Weiche -----
  weather_entity: !input weather_entity
  dull_weather_states: !input dull_weather_states
  morning_scene_dull: !input morning_scene_dull
  day_scene_dull: !input day_scene_dull
  evening_scene_dull: !input evening_scene_dull
  is_dull: "{{ weather_entity | length > 0 and states(weather_entity) in dull_weather_states }}"

  # ----- Abwechslung: eine Szene pro Tag, nicht bei jeder Bewegung -----
  morning_scene_rotation: !input morning_scene_rotation
  day_scene_rotation: !input day_scene_rotation
  evening_scene_rotation: !input evening_scene_rotation
  night_scene_rotation: !input night_scene_rotation
  # Die Nacht nach Mitternacht zählt zum Vortag, damit eine Nacht eine Szene behält.
  rotation_day: >
    {% if now_minutes < morning_minutes %}
      {{ (now() - timedelta(days=1)).strftime('%j') | int }}
    {% else %}
      {{ now().strftime('%j') | int }}
    {% endif %}

  current_scene: >
    {% macro pick(base, extra) -%}
      {%- set c = ([base] + (extra if extra is list else [extra]))
                  | reject('equalto', '') | reject('equalto', none) | unique | list -%}
      {{ c[(rotation_day | int(0)) % (c | length)] }}
    {%- endmacro %}
    {% if use_bright_scene %}
      {{ bright_scene }}
    {% elif is_morning and is_dull and morning_scene_dull | length > 0 %}
      {{ morning_scene_dull }}
    {% elif is_morning and has_morning_scene %}
      {{ pick(morning_scene, morning_scene_rotation) }}
    {% elif is_day and is_dull and day_scene_dull | length > 0 %}
      {{ day_scene_dull }}
    {% elif is_day and has_day_scene %}
      {{ pick(day_scene, day_scene_rotation) }}
    {% elif is_evening and is_dull and evening_scene_dull | length > 0 %}
      {{ evening_scene_dull }}
    {% elif is_evening and has_evening_scene %}
      {{ pick(evening_scene, evening_scene_rotation) }}
    {% elif is_night and has_night_scene %}
      {{ pick(night_scene, night_scene_rotation) }}
    {% else %}
      none
    {% endif %}

  has_current_scene: "{{ current_scene != 'none' }}"

  has_override_adaptive_lights: "{{ override_adaptive_lights | length > 0 }}"
  has_morning_adaptive_lights: "{{ morning_adaptive_lights | length > 0 }}"
  has_day_adaptive_lights: "{{ day_adaptive_lights | length > 0 }}"
  has_evening_adaptive_lights: "{{ evening_adaptive_lights | length > 0 }}"
  has_night_adaptive_lights: "{{ night_adaptive_lights | length > 0 }}"

  current_adaptive_lights: >
    {% if is_morning %}
      {{ morning_adaptive_lights }}
    {% elif is_day %}
      {{ day_adaptive_lights }}
    {% elif is_evening %}
      {{ evening_adaptive_lights }}
    {% else %}
      {{ night_adaptive_lights }}
    {% endif %}

  # Bei aktiver Hell-Szene keine Adaptive Lights nachschalten
  has_current_adaptive_lights: >
    {% if use_bright_scene %}
      {{ false }}
    {% elif is_morning %}
      {{ has_morning_adaptive_lights }}
    {% elif is_day %}
      {{ has_day_adaptive_lights }}
    {% elif is_evening %}
      {{ has_evening_adaptive_lights }}
    {% else %}
      {{ has_night_adaptive_lights }}
    {% endif %}

  has_blocker: "{{ blocker_entity | length > 0 }}"
  is_blocked: "{{ has_blocker and states(blocker_entity) == 'on' }}"
  is_cooldown: "{{ states(cooldown_timer) == 'active' }}"

  # Aktivieren erlaubt, wenn dunkel - oder wenn hell und eine Hell-Szene greift
  can_activate: "{{ not is_blocked and not is_cooldown and (is_dark or use_bright_scene) }}"

  has_monitor_light: "{{ monitor_light | length > 0 }}"

  target_lights_input: !input target_lights
  lights_are_on: >
    {% if has_monitor_light %}
      {{ states(monitor_light) == 'on' }}
    {% else %}
      {% set entities = target_lights_input.entity_id | default([]) %}
      {% set entity_list = [entities] if entities is string else entities %}
      {{ entity_list | select('is_state', 'on') | list | count > 0 }}
    {% endif %}

triggers:
  - id: motion_on
    trigger: state
    entity_id: !input motion_sensor
    from: "off"
    to: "on"

  - id: motion_off
    trigger: state
    entity_id: !input motion_sensor
    from: "on"
    to: "off"

  - id: switch_toggle
    trigger: state
    entity_id: !input override_switch
    from:
      - "on"
      - "off"
    to:
      - "on"
      - "off"

  - id: light_changed
    trigger: state
    entity_id: !input monitor_light
    from:
      - "on"
      - "off"
    to:
      - "on"
      - "off"

  - id: time_change
    trigger: time
    at:
      - !input morning_start
      - !input day_start
      - !input evening_start
      - !input night_start

  - id: off_timer_finished
    trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input off_timer

  # Wächter: Melder meldet ununterbrochen Anwesenheit (bei Dauer 0 wirkungslos, siehe Bedingung)
  - id: presence_watchdog
    trigger: state
    entity_id: !input motion_sensor
    to: "on"
    for: !input presence_max_duration

conditions: []

actions:
  - choose:
      # ===== SCHALTER GEDRÜCKT =====
      - conditions:
          - condition: trigger
            id: switch_toggle
          # Cooldown aktiv = ignorieren (verhindert Doppel-Trigger)
          - condition: template
            value_template: "{{ not is_cooldown }}"
        sequence:
          - choose:
              # Lichter bereits AN → Ausschalten (Toggle-Verhalten)
              - conditions:
                  - condition: template
                    value_template: "{{ lights_are_on }}"
                sequence:
                  - action: timer.cancel
                    target:
                      entity_id: !input off_timer
                  - action: light.turn_off
                    continue_on_error: true
                    target: !input target_lights
                    data:
                      transition: "{{ transition_time }}"
                  # Kurzer Cooldown nach Ausschalten (verhindert Race-Condition)
                  - action: timer.start
                    target:
                      entity_id: !input cooldown_timer
                    data:
                      duration:
                        seconds: 2
                  # Aus-Befehl einmal wiederholen, falls eine Lampe ihn verschluckt hat
                  - delay:
                      seconds: 10
                  - if:
                      - condition: template
                        value_template: "{{ has_monitor_light and is_state(monitor_light, 'off') }}"
                    then:
                      - action: light.turn_off
                        continue_on_error: true
                        target: !input target_lights
            # Lichter AUS → Override aktivieren
            default:
              - action: timer.start
                target:
                  entity_id: !input cooldown_timer
                data:
                  duration: "{{ switch_cooldown }}"
              - action: timer.cancel
                target:
                  entity_id: !input off_timer
              - action: scene.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ override_scene }}"
                data:
                  transition: "{{ transition_time }}"
              - if:
                  - condition: template
                    value_template: "{{ has_override_adaptive_lights }}"
                then:
                  - action: light.turn_on
                    continue_on_error: true
                    target: "{{ override_adaptive_lights }}"

      # ===== LICHT MANUELL EINGESCHALTET =====
      - conditions:
          - condition: trigger
            id: light_changed
          - condition: template
            value_template: "{{ has_monitor_light }}"
          - condition: template
            value_template: "{{ trigger.to_state.state == 'on' }}"
          - condition: template
            value_template: "{{ not is_cooldown }}"
          - condition: template
            value_template: "{{ trigger.to_state.context.parent_id is none }}"
        sequence:
          - action: timer.cancel
            target:
              entity_id: !input off_timer
          - action: timer.start
            target:
              entity_id: !input cooldown_timer
            data:
              duration: "{{ manual_cooldown }}"

      # ===== LICHT MANUELL AUSGESCHALTET =====
      - conditions:
          - condition: trigger
            id: light_changed
          - condition: template
            value_template: "{{ has_monitor_light }}"
          - condition: template
            value_template: "{{ trigger.to_state.state == 'off' }}"
          - condition: template
            value_template: "{{ is_cooldown }}"
          - condition: template
            value_template: "{{ trigger.to_state.context.parent_id is none }}"
        sequence:
          - action: timer.cancel
            target:
              entity_id: !input cooldown_timer

      # ===== BEWEGUNG ERKANNT =====
      - conditions:
          - condition: trigger
            id: motion_on
          - condition: template
            value_template: "{{ lights_are_on or (can_activate and has_current_scene) }}"
        sequence:
          - action: timer.start
            target:
              entity_id: !input off_timer
            data:
              duration: "{{ current_off_delay }}"
          - if:
              - condition: template
                value_template: "{{ can_activate and has_current_scene and not lights_are_on }}"
            then:
              - action: scene.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ current_scene }}"
                data:
                  transition: "{{ transition_time }}"
              - if:
                  - condition: template
                    value_template: "{{ has_current_adaptive_lights }}"
                then:
                  - action: light.turn_on
                    continue_on_error: true
                    target: "{{ current_adaptive_lights }}"

      # ===== BEWEGUNG WEG =====
      - conditions:
          - condition: trigger
            id: motion_off
        sequence:
          - action: timer.start
            target:
              entity_id: !input off_timer
            data:
              duration: "{{ current_off_delay }}"

      # ===== AUSSCHALT-TIMER ABGELAUFEN =====
      - conditions:
          - condition: trigger
            id: off_timer_finished
        sequence:
          - condition: state
            entity_id: !input motion_sensor
            state: "off"
          - action: light.turn_off
            continue_on_error: true
            target: !input target_lights
            data:
              transition: "{{ transition_time }}"
          # Aus-Befehl einmal wiederholen, falls eine Lampe ihn verschluckt hat
          - delay:
              seconds: 10
          - condition: state
            entity_id: !input motion_sensor
            state: "off"
          - action: light.turn_off
            continue_on_error: true
            target: !input target_lights

      # ===== WÄCHTER: MELDER HÄNGT AUF ANWESEND =====
      - conditions:
          - condition: trigger
            id: presence_watchdog
          - condition: template
            value_template: "{{ watchdog_seconds | int(0) > 0 }}"
        sequence:
          - action: timer.cancel
            target:
              entity_id: !input off_timer
          - action: light.turn_off
            continue_on_error: true
            target: !input target_lights
            data:
              transition: "{{ transition_time }}"
          - delay:
              seconds: 10
          - action: light.turn_off
            continue_on_error: true
            target: !input target_lights

      # ===== TAGESZEIT WECHSELT =====
      # Nur wenn das Licht bereits an ist: der Wechsel passt die Szene an,
      # schaltet aber nie von selbst ein (hängender Präsenzmelder, leerer Raum).
      - conditions:
          - condition: trigger
            id: time_change
          - condition: state
            entity_id: !input motion_sensor
            state: "on"
          - condition: template
            value_template: "{{ lights_are_on and can_activate }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ has_current_scene }}"
                sequence:
                  - action: scene.turn_on
                    continue_on_error: true
                    target:
                      entity_id: "{{ current_scene }}"
                    data:
                      transition: "{{ transition_time }}"
                  - if:
                      - condition: template
                        value_template: "{{ has_current_adaptive_lights }}"
                    then:
                      - action: light.turn_on
                        continue_on_error: true
                        target: "{{ current_adaptive_lights }}"
            default:
              - action: light.turn_off
                continue_on_error: true
                target: !input target_lights
                data:
                  transition: "{{ transition_time }}"

    default: []
